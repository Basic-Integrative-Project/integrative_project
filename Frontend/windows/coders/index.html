<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/Frontend/windows/css/coders.css">
    <title>Coders</title>
</head>
<body class="bg-body">

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">

            <div class="col-12 col-md-3 col-xl-2 sidebar position-relative" id="sidebar">
                <button id="sidebarClose" class="d-md-none btn btn-link text-white position-absolute" style="top:15px;right:15px;font-size:20px;padding:0; border:none;">
                    <i class="bi bi-x-lg"></i>
                </button>

                <div class="logo p-4 fw-bold fs-4">
                    <i class="bi bi-inbox-fill"></i> Inboxer
                </div>

                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2">
                        <a href="/Frontend/windows/dashboard/dashboard.html" class="nav-link text-white returnDash">
                            <i class="bi bi-inbox me-2"></i> Inbox
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white active btn-purple rounded">
                            <i class="bi bi-people me-2"></i> Coders
                        </a>
                    </li>
                </ul>

                <div class="user-profile p-3 position-absolute bottom-0 w-100 border-top">
                    <div class="d-flex align-items-center">
                        <div class="user-avatar bg-light rounded-circle" style="width: 40px; height: 40px;"></div>
                        <div class="ms-2">
                            <div class="small fw-bold">Usuario</div>
                            <div class="small opacity-75">user@example.com</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-9 col-xl-10 p-4">

                <div class="d-md-none mb-3">
                    <button class="btn btn-dark" id="menuToggle">
                        <i class="bi bi-list"></i>
                    </button>
                </div>

                <div class="card shadow p-4">
                    
                    <div class="card-header bg-white">
                        <h3>Buscar Coder</h3>
                        <form id="form-busqueda" class="d-flex gap-3 mt-3 mb-3">
                            <input id="input-documento" class="form-control" type="search" placeholder="Ingresa el documento de identidad">
                            <button type="submit" class="btn w-25 btn-purple">Buscar</button>
                        </form>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Last Name</th>
                                    <th>Document</th>
                                    <th>Email</th>
                                    <th>Cel</th>
                                    <th>Clan</th>
                                    <th>Shift</th>
                                    <th>Grade</th>
                                    <th>Profile</th>
                                </tr>
                            </thead>
                            <tbody id="lista-coders">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div> </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="main.js"></script>
</body>
</html>
