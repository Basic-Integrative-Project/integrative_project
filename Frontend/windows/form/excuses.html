<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justificación de Inasistencia</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/excuses.css">
</head>
<body class="bg-body-custom">

    <div class="card-custom">
        <div class="header-custom">
            <h4 class="m-0">Justificación de Inasistencia</h4>
            <p class="small m-0 mt-1 opacity-75">Complete los datos para validar su falta</p>
        </div>

        <div class="p-4">
            <form id="excuseForm" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label for="document" class="form-label">Documento de Identidad</label>
                    <input type="text" id="document" name="document" class="form-control" placeholder="Ej: 10203040" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="cause_id" class="form-label">Motivo de la Falta</label>
                    <select id="cause_id" name="cause_id" class="form-select" required>
                        <option value="" disabled selected>Cargando causas...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small">Detalles de la Causa seleccionada:</label>
                    <textarea id="cause_description" class="form-control bg-light" rows="2" readonly placeholder="La descripción aparecerá aquí..."></textarea>
                </div>

                <div class="mb-4">
                    <label for="support_image" class="form-label">Soporte Médico/Legal (Imagen)</label>
                    <input type="file" id="support_image" name="support_image" class="form-control" accept="image/*" required>
                    <div class="form-text">Solo archivos de imagen (.jpg, .png).</div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
    <span id="btnText">ENVIAR JUSTIFICACIÓN</span>
    <div id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status">
        <span class="visually-hidden">Enviando...</span>
    </div>
</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="excuses.js"></script>

</body>
</html>
