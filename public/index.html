<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Coders</title>
</head>
<body>
    <div class="container">
        <div class="col-md-12">
            <div class="card mt-4">
                <div class="card-header">
                    <h3>Buscar Coder</h3>
                    <form id="form-busqueda" class="d-flex gap-3">
                        <input id="input-documento" class="form-control" type="search" placeholder="Ingresa el documento de identidad">
                        <button type="submit" class="btn btn-info w-25">Buscar</button>
                    </form>
                </div>
                <table class="table table-striped-columns">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Last Name</th>
                            <th>Document</th>
                            <th>Email</th>
                            <th>Cel</th>
                            <th>Clan</th>
                            <th>Shift</th>
                            <th>Grade</th>
                            <th>Profile</th>
                        </tr>
                    </thead>
                    <tbody id="lista-coders">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
