<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Dashboard - Inboxer</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="./css/style.css" />

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  </head>

  <body>
    <div class="container-fluid p-0">
      <div class="row g-0 min-vh-100">

        <!-- 🔵 SIDEBAR -->
        <div class="col-12 col-md-3 col-xl-2 sidebar position-relative">
          <button id="sidebarClose" class="d-md-none btn btn-link text-white position-absolute" style="top:15px;right:15px;font-size:20px;padding:0;"><i class="bi bi-x-lg"></i></button>
          <div class="logo">
            <div class="logo-icon">
              <i class="bi bi-inbox-fill"></i>
            </div>
            Inboxer
          </div>

          <button class="btn-compose">
            <i class="bi bi-pencil-square me-2"></i>Compose
          </button>

          <ul class="nav-menu">
            <li class="nav-item active">
              <i class="bi bi-inbox"></i> Inbox
            </li>

            <button id="refreshBtn" class="nav-item btn btn-link text-white w-100 text-start">
              <i class="bi bi-arrow-clockwise"></i> Recargar
            </button>
          </ul>

          <!-- 🔥 CONTADORES -->
          <div class="stats-cards">
            <div class="stat-card">
              <div class="stat-label">Inbox</div>
              <div class="stat-value" id="inboxCount">0</div>
            </div>
            <div class="stat-card primary">
              <div class="stat-label">Ignorados</div>
              <div class="stat-value" id="engageCount">0</div>
            </div>
          </div>

          <div class="user-profile d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
              <div id="userAvatar" class="user-avatar"></div>
              <div class="user-info ms-2">
                <div id="userName" class="user-name"></div>
                <div id="userEmail" class="user-email small text-white"></div>
              </div>
            </div>

            <button id="logoutBtn" class="btn btn-sm btn-outline-light">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- 🔥 CENTRO -->
        <div class="col-12 col-md-9 col-xl-7 p-4 email-list">

          <div class="d-md-none mb-3">
          <button class="btn btn-outline-dark" id="menuToggle">
            <i class="bi bi-list"></i>
          </button>
        </div>
          <div class="container-fluid">
            <div class="row" id="emailList2"></div>
          </div>
        </div>

        <!-- 🟢 FALTAS / DERECHA -->
        <div class="col-12 col-xl-3 p-4">
          <div class="email-header mb-3">
            <input
              type="text"
              class="search-box form-control"
              placeholder="Search emails..."
            />
          </div>

          <div class="cards-container">
            <div class="email-cards-stack" id="emailList"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="modal fade" id="emailModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content rounded-4 shadow">

          <div class="modal-header">
            <h5 class="modal-title" id="modalSubject">Asunto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-2">
              <span id="modalTag" class="badge"></span>
            </div>

            <div class="mb-2">
              <strong>De:</strong> <span id="modalFrom"></span>
            </div>

            <div class="mb-2 text-muted small">
              <span id="modalDate"></span>
            </div>

            <hr>

            <div id="modalBody" style="white-space: pre-wrap;"></div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cerrar
            </button>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./dashboard.js"></script>
  </body>
</html>
