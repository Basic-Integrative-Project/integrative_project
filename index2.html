<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gmail Unread Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Firebase v10 COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body text-center">

                <h3 class="mb-4">Visor de Correos No Leídos</h3>

                <button id="loginBtn" class="btn btn-danger mb-3">Iniciar sesión con Google</button>
                <button id="connectGmail" class="btn btn-primary mb-3 d-none">Conectar Gmail con n8n</button>
                <button id="getEmails" class="btn btn-success mb-3 d-none">Obtener Correos No Leídos</button>

                <div id="emailList" class="mt-4"></div>

            </div>
        </div>
    </div>

    <script>
        // 🔹 CONFIGURA AQUÍ TUS DATOS DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCZlAmqADGneVmaBOEd_MUpB0JwbpZeG3Y",
            authDomain: "app-b2405.firebaseapp.com",
            projectId: "app-b2405",
            storageBucket: "app-b2405.firebasestorage.app",
            messagingSenderId: "129894344668",
            appId: "1:129894344668:web:243a95d5890c9754b8d119"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();
        let currentUser = null;

        // 🔐 LOGIN CON GOOGLE
        document.getElementById("loginBtn").addEventListener("click", async () => {
            try {
                const result = await auth.signInWithPopup(provider);
                currentUser = result.user;

                await db.collection("users").doc(currentUser.uid).set({
                    email: currentUser.email,
                    name: currentUser.displayName,
                    createdAt: new Date()
                });

                document.getElementById("connectGmail").classList.remove("d-none");
                document.getElementById("getEmails").classList.remove("d-none");

                alert("Login exitoso ✅");
            } catch (error) {
                console.error("Error en login:", error);
                alert("Error en login: " + error.message);
            }
        });

        // 🔁 REDIRIGIR A N8N PARA OAUTH GMAIL
        document.getElementById("connectGmail").addEventListener("click", () => {
            if (!currentUser) {
                alert("Debes iniciar sesión primero");
                return;
            }

            window.location.href =
                "http://localhost:5678/webhook/oauth-start?uid=" +
                encodeURIComponent(currentUser.uid) +
                "&email=" +
                encodeURIComponent(currentUser.email);
        });

        // 📥 OBTENER CORREOS DESDE N8N
        document.getElementById("getEmails").addEventListener("click", async () => {
            if (!currentUser) {
                alert("Debes iniciar sesión primero");
                return;
            }

            try {
                const res = await fetch(
                    "http://localhost:5678/webhook/get-mails?uid=" +
                    encodeURIComponent(currentUser.uid)
                );

                let data = await res.json();
                console.log("Datos crudos de n8n:", data);

                // 🔹 Manejar cualquier estructura: array de items o solo un item
                let emails = [];

                if (Array.isArray(data)) {
                    // Si es un array de objetos { json: {...} }
                    emails = data.map(item => item?.json).filter(item => item);
                } else if (data?.json) {
                    // Si es un solo objeto { json: {...} }
                    emails = [data.json];
                }

                const container = document.getElementById("emailList");
                container.innerHTML = "";

                if (emails.length === 0) {
                    container.innerHTML = "<p>No hay correos no leídos.</p>";
                    return;
                }

                emails.forEach(mail => {
                    const from = mail.from || "Desconocido";
                    const to = mail.to || "Desconocido";
                    const subject = mail.subject || "Sin asunto";
                    const text = mail.text || mail.snippet || "";
                    const date = mail.date ? new Date(mail.date).toLocaleString() : "";

                    container.innerHTML += `
                      <div class="card mb-3 shadow-sm">
                        <div class="card-header bg-primary text-white">${subject}</div>
                        <div class="card-body">
                          <h6 class="card-subtitle mb-2 text-muted">De: ${from}</h6>
                          <h6 class="card-subtitle mb-2 text-muted">Para: ${to}</h6>
                          <p class="card-text" style="max-height: 120px; overflow-y: auto;">${text}</p>
                        </div>
                        <div class="card-footer text-end text-muted">${date}</div>
                      </div>
                    `;
                });

            } catch (error) {
                console.error("Error obteniendo correos:", error);
                alert("Error obteniendo correos");
            }
        });
    </script>

</body>
</html>
