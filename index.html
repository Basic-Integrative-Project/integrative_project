<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gmail Unread Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Firebase v10 COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Nuestro JS externo -->
    <script defer src="script.js"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body text-center">

                <h3 class="mb-4">Visor de Correos No Leídos</h3>

                <button id="loginBtn" class="btn btn-danger mb-3">Iniciar sesión con Google</button>
                <button id="connectGmail" class="btn btn-primary mb-3 d-none">Conectar Gmail con n8n</button>
                <button id="getEmails" class="btn btn-success mb-3 d-none">Obtener Correos No Leídos</button>

                <div id="emailList" class="mt-4"></div>

            </div>
        </div>
    </div>

</body>

</html>
